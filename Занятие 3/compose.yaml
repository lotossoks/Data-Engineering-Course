name: hse-practice3
services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: student
      POSTGRES_PASSWORD: studentpass
      PGPASSWORD: studentpass
    ports:
      - "127.0.0.1:${PG_PORT:-5438}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init/postgres.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U student -d shop -Atc 'select version from seed_ready' | grep -qx 1"]
      interval: 5s
      timeout: 5s
      retries: 120
  greenplum:
    image: andruche/greenplum:7-4seg@sha256:620d6c4863520685d6b475044195f766d3dfbc7c5a3fcfe965c8ac64f2ba47aa
    hostname: gp-practice3
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/gpdb/bin/psql -h 127.0.0.1 -U gpadmin -d postgres -Atc 'select 1' | grep -qx 1"]
      interval: 5s
      timeout: 5s
      retries: 120
    ports:
      - "127.0.0.1:${GP_PORT:-5439}:5432"
    shm_size: 512mb
    volumes:
      - gp_data:/data
  clickhouse:
    image: clickhouse/clickhouse-server:25.8@sha256:0152dd511befe6a2c2ef53e930726179669b08116da78500b37c51c96ff5ee77
    environment:
      CLICKHOUSE_DB: shop
      CLICKHOUSE_USER: student
      CLICKHOUSE_PASSWORD: studentpass
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${CH_HTTP_PORT:-8125}:8123"
      - "127.0.0.1:${CH_NATIVE_PORT:-9003}:9000"
    volumes:
      - ch_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "student", "--password", "studentpass", "--query", "select 1"]
      interval: 5s
      timeout: 5s
      retries: 120

  # Одноразовая подготовка: ждёт PostgreSQL с данными и готовый Greenplum.
  init-greenplum:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    depends_on:
      postgres:
        condition: service_healthy
      greenplum:
        condition: service_healthy
    environment:
      PGPASSWORD: studentpass
    volumes:
      - ./init/greenplum.sql:/init/greenplum.sql:ro
      - init_checks:/checks
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ "$$(psql -h greenplum -U gpadmin -d postgres -Atc "select 1 from pg_database where datname = 'shop'")" != "1" ]; then
          psql -h greenplum -U gpadmin -d postgres -v ON_ERROR_STOP=1 -c 'create database shop'
        fi
        if [ "$$(psql -h greenplum -U gpadmin -d shop -Atc 'select version from seed_ready' 2>/dev/null || true)" != "1" ]; then
          echo 'Загружаем 1 млн заказов в Greenplum...'
          psql -h greenplum -U gpadmin -d shop -v ON_ERROR_STOP=1 -f /init/greenplum.sql
        else
          echo 'Greenplum: данные уже подготовлены, сохраняем таблицы.'
        fi
        test "$$(psql -h greenplum -U gpadmin -d shop -Atc 'select count(*) from orders_source')" = "1000000"
        test "$$(psql -h greenplum -U gpadmin -d shop -Atc 'select count(*) from customers')" = "100000"
        psql -h postgres -U student -d shop -At -F '|' -c 'select count(*), sum(order_id), (sum(total_amount)*100)::bigint from orders_large' > /checks/postgres.txt
        test "$$(cat /checks/postgres.txt)" = "5000000|12500002500000|2501502250010"
        if [ "$$(psql -h postgres -U student -d shop -Atc 'select count(*) from orders_small')" != "1000" ]; then
          psql -h postgres -U student -d shop -v ON_ERROR_STOP=1 -c 'begin; truncate orders_small; insert into orders_small select * from orders_large where order_id <= 1000; analyze orders_small; commit;'
        fi
        echo 'Greenplum и PostgreSQL готовы.'
    restart: "no"

  # После GP загружает CH и сравнивает контрольные суммы с PostgreSQL.
  init-clickhouse:
    image: clickhouse/clickhouse-server:25.8@sha256:0152dd511befe6a2c2ef53e930726179669b08116da78500b37c51c96ff5ee77
    depends_on:
      init-greenplum:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    volumes:
      - ./init/clickhouse.sql:/init/clickhouse.sql:ro
      - init_checks:/checks:ro
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        if [ "$$(clickhouse-client --host clickhouse --user student --password studentpass --query 'select version from shop.seed_ready' 2>/dev/null || true)" != "1" ]; then
          echo 'Копируем 5 млн заказов PostgreSQL → ClickHouse...'
          clickhouse-client --host clickhouse --user student --password studentpass --multiquery < /init/clickhouse.sql
        else
          echo 'ClickHouse: данные уже подготовлены, сохраняем таблицы.'
        fi
        if [ "$$(clickhouse-client --host clickhouse --user student --password studentpass --query 'select count(*) from shop.orders_small')" != "1000" ]; then
          clickhouse-client --host clickhouse --user student --password studentpass --multiquery --query 'truncate table shop.orders_small; insert into shop.orders_small select * from shop.orders_large where order_id <= 1000; optimize table shop.orders_small final;'
        fi
        ch_check=$$(clickhouse-client --host clickhouse --user student --password studentpass --query "select concat(toString(count()), '|', toString(sum(order_id)), '|', toString(toInt64(sum(total_amount)*100))) from shop.orders_large")
        pg_check=$$(cat /checks/postgres.txt)
        if [ "$$pg_check" != "$$ch_check" ]; then
          echo "Контроль не совпал: PG=$$pg_check CH=$$ch_check" >&2
          exit 1
        fi
        echo "Готово: $$ch_check (строки | сумма id | сумма в копейках)."
    restart: "no"

volumes:
  pg_data:
  gp_data:
  ch_data:
  init_checks:
